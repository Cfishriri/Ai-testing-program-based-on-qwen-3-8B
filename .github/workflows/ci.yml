name: CI

on:
  push:
    branches:
      - agent/prepare-reproducible-project
  pull_request:

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run source contract tests
        run: python -m unittest discover -s tests -v
